# Hosted Isaac config (the real-robot gate). Same v2 pinned-task contract as the fixture
# config; the saved-scene env_id, grader and eval come from the installed SDK task pack, so
# this config no longer carries env_id or a module_path the candidate could repoint.
schema_version: cybernetic-behavior-ci-config/v1
project: unitree-g1-vla-policies
robot: Unitree G1-compatible humanoid proxy
artifacts:
  out: artifacts/behavior-ci
  require_replay_provenance: isaac-sim-session-video
simulator:
  adapter: isaac-session
  session:
    scene_env: behavior-ci-tabletop-welding
    camera: /World/Cameras/BehaviorCI_PassFailCamera
    gpu_spec: rtx4090
    idle_timeout_minutes: 30
    ready_timeout_seconds: 1800
policy_backends:
  scripted-vla-shim:
    type: scripted
task_source:
  kind: repo
  dir: tasks
