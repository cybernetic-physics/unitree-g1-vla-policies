schema_version: cybernetic-behavior-ci-config/v1
project: unitree-g1-vla-policies
robot: Unitree G1-compatible humanoid proxy

artifacts:
  out: artifacts/behavior-ci
  # Hosted runs produce genuine Isaac session replay video.
  require_replay_provenance: isaac-sim-session-video

simulator:
  # Real backend: boots a hosted Cybernetic Physics Isaac session, spawns the
  # Unitree G1, uploads isaac/behavior_ci_env.py, and builds + calibrates the
  # welding scene at runtime — no dependency on a pre-published environment.
  # base/MCP URLs default to hosted production in the SDK; only CYBERNETICS_API_KEY
  # is required in the environment.
  adapter: isaac-session
  session:
    scene_env: behavior-ci-tabletop-welding
    camera: /World/Cameras/BehaviorCI_PassFailCamera
    # Pin a dedicated rtx4090: the warm pool currently serves a stale node image
    # whose Isaac MCP bridge never connects (warm-node image not yet promoted).
    gpu_spec: rtx4090
    spawn_robot: g1
    spawn_position: [0, -0.55, 0]
    module_path: isaac/behavior_ci_env.py
    setup_entrypoint: setup_scene
    idle_timeout_minutes: 30
    ready_timeout_seconds: 900
    # Optional: env_id of a pre-published scene to warm-start from (skips authoring).
    # env_id: env_...

policy_backends:
  scripted-vla-shim:
    type: scripted

evals:
  obstacle_shift:
    path: evals/g1_weld_obstacle_shift.yaml
