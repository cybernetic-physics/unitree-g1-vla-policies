# Offline fixture config (local dev + the secrets-free CI contract job).
# The policy is a v2 manifest that names a pinned SDK Task Pack; the eval, scenario geometry,
# grader, held-out bank and saved-scene env_id all come from that pack -- NOT from this repo.
# This config only selects the adapter and output dir.
schema_version: cybernetic-behavior-ci-config/v1
project: unitree-g1-vla-policies
robot: Unitree G1-compatible humanoid proxy
artifacts:
  out: artifacts/behavior-ci
simulator:
  adapter: fixture
  session:
    scene_env: behavior-ci-pipe-yard-welding
    camera: /World/Cameras/BehaviorCI_PassFailCamera
policy_backends:
  scripted-vla-shim:
    type: scripted
# (sha256 in the SDK task lock); editing it is rejected by `verify-task` (exit 4) and ignored
# for grading. Kept here only for readability.
task_source:
  kind: repo
  dir: tasks
