name: Cybernetic Behavior CI

# Behavior CI with an ENFORCED trust boundary. A policy PR may change only its opaque
# checkpoint (policies/*.pt). The judge -- eval thresholds, scenario geometry, action
# contract, grader and saved-scene env_id -- lives in the pinned SDK Task Pack, not this repo.
#
#   * contract job (secrets-free, runs on every PR incl. forks): closed-schema + pin check via
#     `verify-task`, then the fixture eval. A gaming attempt turns it RED:
#       - inflate / smuggle a key in the .pt         -> exit 2 (closed v2 schema)
#       - crank the detour to "be safer"             -> exit 1 (non-monotone measurement)
#       - edit the eval/grader copy to lower the bar -> exit 4 (pin mismatch; edit is inert)
#       - tune the checkpoint honestly               -> exit 0 (earned by a measured trajectory)
#   * behavior-isaac job: the real G1 run on the saved scene (needs the platform API key).
#     The AUTHORITATIVE verdict must be a platform-posted check (see POST-MERGE in the PR).
#
# The SDK is pinned by COMMIT SHA (not @main) so the judge cannot move under a PR.

on:
  pull_request:
    paths:
      - "policies/**"
      - "configs/**"
      - "evals/**"
      - "isaac/**"
      - "cybernetic-behavior-ci.yaml"
      - "cybernetic-behavior-ci.hosted.yaml"
      - ".github/workflows/cybernetic-behavior-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  # Pinned by commit SHA on the cybernetic SDK (PR cybernetic-physics/cybernetic#10).
  CYBERNETICS_SDK_SPEC: "cybernetic-physics[behavior-ci] @ git+https://github.com/cybernetic-physics/cybernetic.git@be45525d5051e6f1d82036f2ce0e014243a19490"

jobs:
  contract:
    name: Behavior CI — integrity + fixture (offline, no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Cybernetics SDK
        run: pip install "${CYBERNETICS_SDK_SPEC}"

      - name: Resolve changed policy
        id: policy
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          ref=""
          if [ -n "${BASE_REF:-}" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF" || true
            ref="$(git diff --name-only "origin/$BASE_REF...HEAD" -- 'policies/*.pt' | sort | tail -n 1 || true)"
          fi
          [ -n "$ref" ] || ref="policies/g1_weld_approach_v21.pt"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Changed policy: $ref"

      - name: Validate configs
        run: |
          set -euo pipefail
          cybernetics behavior-ci validate-config --config cybernetic-behavior-ci.yaml
          cybernetics behavior-ci validate-config --config cybernetic-behavior-ci.hosted.yaml

      - name: Integrity gate (closed schema + pinned eval/grader)
        run: |
          cybernetics behavior-ci verify-task \
            --config cybernetic-behavior-ci.yaml \
            --policy-ref "${{ steps.policy.outputs.ref }}"

      - name: Behavior (fixture eval — visible + held-out)
        run: |
          cybernetics behavior-ci run \
            --config cybernetic-behavior-ci.yaml \
            --policy-ref "${{ steps.policy.outputs.ref }}" \
            --eval obstacle_shift \
            --out artifacts/behavior-ci

      - name: Upload artifact bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-ci-fixture
          path: artifacts/behavior-ci
          if-no-files-found: warn

  behavior-isaac:
    name: Behavior CI — real hosted Isaac (Unitree G1)
    runs-on: ubuntu-latest
    needs: contract
    # Dispatch-only until the hosted grader's per-scenario placement + actuation is
    # smoke-tested on a live GPU session (see the PR's post-merge steps). The secrets-free
    # `contract` job above -- which uses the IDENTICAL measurement -- is the PR gate.
    if: github.event_name == 'workflow_dispatch'
    environment: behavior-ci
    env:
      CYBERNETICS_API_KEY: ${{ secrets.CYBERNETICS_API_KEY }}
      CYBERNETICS_MCP_API_KEY: ${{ secrets.CYBERNETICS_MCP_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gate on platform credentials
        id: gate
        shell: bash
        run: |
          if [ -z "${CYBERNETICS_API_KEY:-}" ]; then
            echo "::notice::Hosted Isaac validation skipped — no CYBERNETICS_API_KEY (fork or unset). This posts NEUTRAL, not success; the authoritative verdict is the platform-posted check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned Cybernetics SDK
        if: steps.gate.outputs.skip == 'false'
        run: pip install "${CYBERNETICS_SDK_SPEC}"
      - name: Resolve changed policy
        if: steps.gate.outputs.skip == 'false'
        id: policy
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF" || true
          ref="$(git diff --name-only "origin/$BASE_REF...HEAD" -- 'policies/*.pt' | sort | tail -n 1 || true)"
          [ -n "$ref" ] || ref="policies/g1_weld_approach_v21.pt"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Run Behavior CI on the real G1
        if: steps.gate.outputs.skip == 'false'
        run: |
          cybernetics behavior-ci run \
            --config cybernetic-behavior-ci.hosted.yaml \
            --policy-ref "${{ steps.policy.outputs.ref }}" \
            --eval obstacle_shift \
            --out artifacts/behavior-ci-hosted
