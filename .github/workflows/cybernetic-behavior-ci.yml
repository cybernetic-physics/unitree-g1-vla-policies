name: Cybernetic Behavior CI

# The real behavior gate: validates a changed Unitree G1 policy by running it in
# a hosted Cybernetic Physics Isaac Sim session (the `isaac-session` SDK adapter),
# measuring the weld-approach off the real robot. There is no fixture/deterministic
# pass-fail here — fixture mode exists only for local dev (cybernetic-behavior-ci.yaml).
#
# Org PRs (same-repo branches) have the `behavior-ci` Environment secrets, so the
# real Isaac eval runs. Fork PRs don't receive secrets, so the hosted job skips
# with a notice (it does not fake a green behavior result).

on:
  pull_request:
    paths:
      - "policies/**"
      - "configs/**"
      - "evals/**"
      - "isaac/**"
      - "cybernetic-behavior-ci.yaml"
      - "cybernetic-behavior-ci.hosted.yaml"
      - ".github/workflows/cybernetic-behavior-ci.yml"
  workflow_dispatch:
    inputs:
      policy_ref:
        description: Policy manifest path under policies/*.pt
        required: false
        default: policies/g1_weld_approach_v18.pt
        type: string

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  CYBERNETICS_SDK_SPEC: "cybernetic-physics[behavior-ci] @ git+https://github.com/cybernetic-physics/cybernetic.git@main"

jobs:
  contract:
    name: SDK + config contract (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Cybernetics SDK
        run: pip install "${CYBERNETICS_SDK_SPEC}"
      - name: Validate configs (does not validate robot behavior)
        run: |
          set -euo pipefail
          cybernetics behavior-ci validate-config --config cybernetic-behavior-ci.yaml
          cybernetics behavior-ci validate-config --config cybernetic-behavior-ci.hosted.yaml

  behavior-isaac:
    name: Behavior CI — real hosted Isaac (Unitree G1)
    runs-on: ubuntu-latest
    needs: contract
    environment: behavior-ci
    env:
      # Secret: only the API key (and the gateway key if it differs).
      CYBERNETICS_API_KEY: ${{ secrets.CYBERNETICS_API_KEY }}
      CYBERNETICS_MCP_API_KEY: ${{ secrets.CYBERNETICS_MCP_API_KEY }}
      # Non-secret config. base/MCP URLs default to hosted production in the SDK;
      # the env id is a repo Variable (it identifies the published showcase env).
      BEHAVIOR_CI_ENV_ID: ${{ vars.BEHAVIOR_CI_ENV_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Cybernetics SDK
        run: pip install "${CYBERNETICS_SDK_SPEC}"

      - name: Gate on platform credentials
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CYBERNETICS_API_KEY:-}" ] || [ -z "${BEHAVIOR_CI_ENV_ID:-}" ]; then
            echo "::notice::Hosted Isaac validation skipped — no platform credentials/env on this repo or fork. The Cybernetic Physics org CI runs the real Unitree G1 eval; sign up to run it on your own robot."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve policy ref
        if: steps.gate.outputs.skip == 'false'
        id: policy
        shell: bash
        env:
          INPUT_POLICY_REF: ${{ github.event.inputs.policy_ref }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          policy_ref="${INPUT_POLICY_REF:-}"
          if [ -z "$policy_ref" ] && [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            policy_ref="$(git diff --name-only "origin/$BASE_REF"...HEAD -- 'policies/*.pt' | sort | tail -n 1)"
          fi
          [ -n "$policy_ref" ] || policy_ref="policies/g1_weld_approach_v19.pt"
          case "$policy_ref" in policies/*.pt) ;; *) echo "::error::policy ref must be policies/*.pt"; exit 2 ;; esac
          echo "policy_ref=$policy_ref" >> "$GITHUB_OUTPUT"
          echo "Resolved policy: $policy_ref"

      - name: Run Behavior CI on the real G1
        if: steps.gate.outputs.skip == 'false'
        id: run
        shell: bash
        run: |
          set +e
          cybernetics behavior-ci run \
            --config cybernetic-behavior-ci.hosted.yaml \
            --policy-ref "${{ steps.policy.outputs.policy_ref }}" \
            --eval obstacle_shift \
            --out artifacts/behavior-ci
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload artifact bundle
        if: steps.gate.outputs.skip == 'false' && always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-ci-artifacts
          path: artifacts/behavior-ci
          if-no-files-found: warn

      - name: Upsert PR comment
        if: steps.gate.outputs.skip == 'false' && always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'artifacts/behavior-ci/comment.md';
            if (!fs.existsSync(path)) { core.warning('no comment.md produced'); return; }
            const marker = '<!-- cybernetic-behavior-ci -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = fs.readFileSync(path, 'utf8') + `\n\nArtifacts: [behavior-ci-artifacts](${runUrl})`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Finalize result
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.gate.outputs.skip }}" = "true" ]; then
            echo "Hosted Isaac validation skipped (no credentials); not a behavior pass."
            exit 0
          fi
          code="${{ steps.run.outputs.exit_code }}"
          case "$code" in
            0) echo "G1 behavior passed" ;;
            1) echo "::error::Unitree G1 behavior regression"; exit 1 ;;
            *) echo "::error::hosted behavior CI failed (exit $code)"; exit "$code" ;;
          esac
