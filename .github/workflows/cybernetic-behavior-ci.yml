name: Cybernetic Behavior CI

on:
  pull_request:
    paths:
      - "policies/**"
      - "configs/**"
      - "evals/**"
      - "scripts/**"
      - "assets/isaac-replays/**"
      - ".github/workflows/cybernetic-behavior-ci.yml"
  workflow_dispatch:
    inputs:
      policy_ref:
        description: Policy manifest path under this repository.
        required: true
        default: policies/g1_weld_approach_v18.pt
        type: string

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: read

jobs:
  behavior-ci:
    name: Behavior CI obstacle-shift suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve policy ref
        id: policy
        shell: bash
        env:
          INPUT_POLICY_REF: ${{ github.event.inputs.policy_ref }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          policy_ref="${INPUT_POLICY_REF:-}"
          if [ -z "$policy_ref" ] && [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            changed_policy="$(
              git diff --name-only "origin/$BASE_REF"...HEAD -- \
                'policies/*.pt' \
                | sort \
                | tail -n 1
            )"
            policy_ref="$changed_policy"
          fi
          if [ -z "$policy_ref" ]; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              policy_ref="policies/g1_weld_approach_v19.pt"
            else
              policy_ref="policies/g1_weld_approach_v18.pt"
            fi
          fi

          case "$policy_ref" in
            policies/*.pt) ;;
            *)
              echo "::error::Policy ref must be a policy manifest under policies/*.pt"
              exit 2
              ;;
          esac

          echo "policy_ref=$policy_ref" >> "$GITHUB_OUTPUT"
          echo "Resolved policy: $policy_ref"

      - name: Run Behavior CI
        id: run_behavior_ci
        shell: bash
        run: |
          set +e
          python3 scripts/cybernetic_behavior_ci.py \
            --robot unitree-g1-or-selected-humanoid \
            --policy-ref "${{ steps.policy.outputs.policy_ref }}" \
            --task configs/tasks/tabletop_welding.yaml \
            --eval evals/g1_weld_obstacle_shift.yaml \
            --scene-env behavior-ci-tabletop-welding \
            --camera /World/Cameras/BehaviorCI_PassFailCamera \
            --out artifacts \
            --replay-source-dir assets/isaac-replays \
            --require-isaac-replays \
            --artifact-base-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          exit_code="$?"
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: behavior-ci-artifacts
          path: artifacts
          if-no-files-found: error

      - name: Add job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f artifacts/comment.md ]; then
            cat artifacts/comment.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upsert pull request comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- cybernetic-behavior-ci -->';
            const commentPath = 'artifacts/comment.md';
            if (!fs.existsSync(commentPath)) {
              core.warning('Behavior CI comment artifact was not generated.');
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = fs.readFileSync(commentPath, 'utf8') + `\n\nArtifacts: [behavior-ci-artifacts](${runUrl})`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Finalize Behavior CI result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          exit_code="${{ steps.run_behavior_ci.outputs.exit_code }}"
          if [ -z "$exit_code" ]; then
            echo "::error::Behavior CI did not produce an exit code"
            exit 3
          fi
          if [ "$exit_code" -eq 0 ]; then
            exit 0
          fi
          if [ "$exit_code" -eq 1 ]; then
            echo "::error::Behavior CI detected a robot behavior regression"
            exit 1
          fi
          echo "::error::Behavior CI infrastructure or artifact failure, exit code $exit_code"
          exit "$exit_code"
