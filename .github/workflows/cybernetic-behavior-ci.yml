name: Cybernetic Behavior CI

# Default public check: runs the deterministic fixture adapter. No secrets, no
# GPU — every external contributor's PR gets a red/green robot-behavior verdict.
# Real hosted-Isaac runs live in behavior-ci-hosted.yml (manual, gated on secrets).

on:
  pull_request:
    paths:
      - "policies/**"
      - "configs/**"
      - "evals/**"
      - "cybernetic-behavior-ci.yaml"
      - "assets/isaac-replays/**"
      - ".github/workflows/cybernetic-behavior-ci.yml"
  workflow_dispatch:
    inputs:
      policy_ref:
        description: Policy manifest path under policies/*.pt
        required: false
        default: policies/g1_weld_approach_v18.pt
        type: string

permissions:
  contents: read
  pull-requests: write
  checks: write

# The SDK provides the runner: `cybernetics behavior-ci run`.
env:
  CYBERNETICS_SDK_SPEC: "cybernetic-physics[behavior-ci] @ git+https://github.com/cybernetic-physics/cybernetic.git@main"

jobs:
  behavior-ci:
    name: Behavior CI obstacle-shift suite (fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Cybernetics SDK
        run: pip install "${CYBERNETICS_SDK_SPEC}"

      - name: Resolve policy ref
        id: policy
        shell: bash
        env:
          INPUT_POLICY_REF: ${{ github.event.inputs.policy_ref }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          policy_ref="${INPUT_POLICY_REF:-}"
          if [ -z "$policy_ref" ] && [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            policy_ref="$(git diff --name-only "origin/$BASE_REF"...HEAD -- 'policies/*.pt' | sort | tail -n 1)"
          fi
          if [ -z "$policy_ref" ]; then
            policy_ref="policies/g1_weld_approach_v19.pt"
          fi
          case "$policy_ref" in
            policies/*.pt) ;;
            *) echo "::error::policy ref must be policies/*.pt"; exit 2 ;;
          esac
          echo "policy_ref=$policy_ref" >> "$GITHUB_OUTPUT"
          echo "Resolved policy: $policy_ref"

      - name: Run Behavior CI
        id: run
        shell: bash
        run: |
          set +e
          cybernetics behavior-ci run \
            --config cybernetic-behavior-ci.yaml \
            --policy-ref "${{ steps.policy.outputs.policy_ref }}" \
            --eval obstacle_shift \
            --out artifacts/behavior-ci
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload artifact bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-ci-artifacts
          path: artifacts/behavior-ci
          if-no-files-found: error

      - name: Job summary
        if: always()
        shell: bash
        run: |
          [ -f artifacts/behavior-ci/comment.md ] && cat artifacts/behavior-ci/comment.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upsert PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'artifacts/behavior-ci/comment.md';
            if (!fs.existsSync(path)) { core.warning('no comment.md produced'); return; }
            const marker = '<!-- cybernetic-behavior-ci -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = fs.readFileSync(path, 'utf8') + `\n\nArtifacts: [behavior-ci-artifacts](${runUrl})`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Finalize result (red on behavior regression)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          code="${{ steps.run.outputs.exit_code }}"
          case "$code" in
            0) echo "behavior passed"; exit 0 ;;
            1) echo "::error::robot behavior regression"; exit 1 ;;
            *) echo "::error::behavior CI failed (exit $code)"; exit "$code" ;;
          esac
